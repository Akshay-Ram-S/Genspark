<div class="position-relative" #bellWrapper>
      <button class="btn" (click)="togglePanel()" title="Notifications">
        <i class="bi bi-bell fs-5"></i>
        @if (unreadCount > 0) {
            <span class="position-absolute top-0 start-100 translate-middle badge bg-danger">
                {{ unreadCount }}
            </span>
        }
      </button>

      <div class="position-absolute bg-white shadow p-3 border rounded mt-2"
        style="right: 0; width: 300px; z-index: 1000;"
        *ngIf="showPanel">
        <h6 class="mb-2">Bid Notifications</h6>
        <div *ngIf="notifications.length === 0" class="text-muted">
          No new bids.
        </div>
        <ul class="list-group list-group-flush">
          <li *ngFor="let n of notifications" class="list-group-item small">
            Bidder: <strong>{{ n.bidder }}</strong> placed ${{ n.amount }} on <em>{{ n.title }} <span class="text-muted">{{ n.timestamp | date: 'short' }} </span></em>
          </li>
        </ul>
      </div>
</div>
