<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg overflow-hidden" style="width: 100%; max-width: 500px; background-color: #F5F5DC;">
    
    <div class="text-white text-center py-4" style="background-color: goldenrod;">
      <h4 class="mb-0">My Profile</h4>
    </div>

    <div class="p-4">
      <ul class="list-group list-group-flush mb-4">
        <li class="list-group-item d-flex justify-content-between" style="background-color: #F5F5DC;">
          <span class="fw-semibold">Name:</span>
          <span>{{ user?.name }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between" style="background-color: #F5F5DC;">
          <span class="fw-semibold">Email:</span>
          <span>{{ user?.email }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between" style="background-color: #F5F5DC;">
          <span class="fw-semibold">Role:</span>
          <span>{{ user?.role }}</span>
        </li>
      </ul>

      <div class="text-center">
        <button class="btn" style="background-color: goldenrod; color: white;" (click)="onEdit()">Edit Profile</button>
      </div>
    </div>

  </div>
</div>

<br />
<br />
<br />

<div class="container mt-4">
  @if (isSeller(); as seller) {
    <h2 class="section-title">Items Posted By Seller</h2>
    <app-seller-items></app-seller-items>
  } @else {
    <h2 class="section-title">Bids Placed By Bidder</h2>
    <app-bidder-bids></app-bidder-bids>
  } 
</div>
