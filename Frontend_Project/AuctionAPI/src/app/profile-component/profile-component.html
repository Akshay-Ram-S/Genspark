<div class="container-fluid my-5 px-4">
  <div class="row g-4">
    <!-- Profile Card (Left Column) -->
    <div class="col-lg-4 col-md-12">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate__animated animate__fadeIn">
        <div class="card-header bg-gradient-primary text-white text-center py-4">
          <h3 class="mb-0 fw-bold">User Profile</h3>
        </div>
        <div class="card-body py-5 px-4">
          <div class="avatar mx-auto mb-4 position-relative">
            <div class="initials display-4 bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 100px; height: 100px; font-size: 2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
              {{ user?.name?.[0] | uppercase }}
            </div>
          </div>

          <h4 class="text-capitalize text-center mb-4 fw-bold text-dark">{{ user?.name }}</h4>

          <ul class="list-group list-group-flush mb-4">
            <li class="list-group-item d-flex py-3">
              <i class="bi bi-envelope-fill text-primary me-3" style="font-size: 1.2rem;"></i>
              <div>
                <strong>Email</strong><br>
                <span class="text-muted">{{ user?.email }}</span>
              </div>
            </li>
            <li class="list-group-item d-flex align-items-center py-3">
              <i class="bi bi-person-badge-fill text-success me-3" style="font-size: 1.2rem;"></i>
              <div>
                <strong>Role</strong><br>
                <span class="text-muted">{{ user?.role | titlecase }}</span>
              </div>
            </li>
            <li class="list-group-item d-flex align-items-center py-3">
              <i class="bi bi-telephone-fill text-warning me-3" style="font-size: 1.2rem;"></i>
              <div>
                <strong>Phone</strong><br>
                <span class="text-muted">{{ user?.phone ?? 'N/A' }}</span>
              </div>
            </li>
          </ul>

          <div *ngIf="isOwnProfile" class="d-flex justify-content-center gap-3 mt-4">
            <button class="btn btn-primary rounded-pill px-4 py-2 fw-semibold transition-all" (click)="changePassword()">
              <i class="bi bi-key-fill me-2"></i> Change Password
            </button>
            <button class="btn btn-outline-danger rounded-pill px-4 py-2 fw-semibold transition-all" data-bs-toggle="modal" data-bs-target="#deleteModal">
              <i class="bi bi-trash-fill me-2"></i> Delete Account
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="col-lg-8 col-md-12">
      <div class="d-flex flex-column gap-4">
        @if (isSeller()) {
          <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate__animated animate__fadeInRight">
            <div class="card-header bg-gradient-dark text-white py-4">
              <h3 class="mb-0 fw-semibold text-center">Your Posted Items</h3>
            </div>
            <div class="card-body p-4" style="max-height: 600px; overflow-y: auto;">
              <app-seller-items [id]="sellerId ?? ''" [sellerName]="user.name" [ownProfile]="isOwnProfile"></app-seller-items>
            </div>
          </div>
        }
        @else if (isBidder() && isOwnProfile) {
          <div class="row g-4">
            <div class="col-12">
              <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate__animated animate__fadeInRight">
                <div class="card-header bg-gradient-dark text-white py-4">
                  <h3 class="mb-0 fw-semibold text-center">Items Bought</h3>
                </div>
                <div class="card-body p-4" style="max-height: 400px; overflow-y: auto;">
                  <app-items-bought [bidderId]="bidderId ?? ''"></app-items-bought>
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="card shadow-lg border-0 rounded-4 overflow-hidden animate__animated animate__fadeInRight" style="animation-delay: 0.2s;">
                <div class="card-header bg-gradient-dark text-white py-4">
                  <h3 class="mb-0 fw-semibold text-center">Bids Placed</h3>
                </div>
                <div class="card-body p-4" style="max-height: 400px; overflow-y: auto;">
                  <app-bidder-bids [id]="bidderId ?? ''"></app-bidder-bids>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
