<div class="container my-5">
  <div class="text-center mb-4">
    <h1 class="fw-bold" style="color: goldenrod;">{{ roleType | titlecase }}s</h1>
  </div>

  <div class="d-flex justify-content-center mb-3" *ngIf="users.length > 0">
    <div
      class="rounded-circle d-flex flex-column align-items-center justify-content-center animate__animated animate__zoomIn animate__slower shadow-lg"
      style="width: 100px; height: 100px; background-color: goldenrod; color: white; font-size: 1.5rem; font-weight: bold; transition: transform 0.3s ease;"
      onmouseover="this.style.transform='scale(1.1)'"
      onmouseout="this.style.transform='scale(1)'"
    >
      <i class="bi bi-people-fill fs-3 mb-1"></i>
      {{ users.length }}
    </div>
  </div>


  <br/>

  <div class="row g-4 justify-content-center animate__animated animate__zoomIn animate__slower">
    @for (user of users; track user.email) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <app-user [user]="user"></app-user>
      </div>
    }
  </div>
</div>
