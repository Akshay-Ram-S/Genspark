<nav class="navbar navbar-expand-lg shadow-sm py-3 custom-navbar">
  <div class="container-fluid px-4">

    <a class="navbar-brand fs-3 d-flex align-items-center" routerLink="/">
      <i class="bi bi-gem me-2"></i> AuctionAPI
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item mx-2">
          <a class="nav-link fs-5" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-house-door me-1"></i> Home
          </a>
        </li>
        <li class="nav-item mx-2">
          <a class="nav-link fs-5" routerLink="/items" routerLinkActive="active">
            <i class="bi bi-box-seam me-1"></i> Items
          </a>
        </li>
        <li class="nav-item dropdown mx-2">
          <a class="nav-link dropdown-toggle fs-5" href="#" id="userDropdown" role="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-people me-1"></i> Users
          </a>
          <ul class="dropdown-menu" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" routerLink="/users/seller" routerLinkActive="active">Sellers List</a></li>
            <li><a class="dropdown-item" routerLink="/users/bidder" routerLinkActive="active">Bidders List</a></li>
          </ul>
        </li>
        <li class="nav-item mx-2" *ngIf="isSeller || isAdmin">
          <a class="nav-link fs-5" routerLink="/post-item" routerLinkActive="active">
            <span class="bi bi-pencil-square"></span> Post Item
          </a>
        </li>
        <li class="nav-item mx-2" *ngIf="isAdmin">
          <a class="nav-link fs-5" routerLink="/dashboard" routerLinkActive="active">
            <span class="bi bi-grid-fill"></span> Dashboard
          </a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <ng-container *ngIf="isLoggedIn; else showLogin">

          <li class="nav-item mx-2">
            <app-notification></app-notification>
          </li>

          <li class="nav-item mx-2">
            <a
              class="nav-link d-flex align-items-left justify-content-left"
              routerLink="/profile"
              routerLinkActive="active"
              title="Profile"
              style="padding: 0.25rem;"
            >
              <i class="bi bi-person-circle profile-icon"></i>
            </a>
          </li>

          <li class="nav-item mx-2">
            <button class="btn btn-light fs-5 d-flex align-items-center" (click)="logout()">
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
          </li>
        </ng-container>

        <ng-template #showLogin>
          <li class="nav-item mx-1">
            <a class="btn btn-light fs-5 d-flex align-items-center" routerLink="/login">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </a>
          </li>
        </ng-template>
      </ul>

    </div>
  </div>
</nav>
