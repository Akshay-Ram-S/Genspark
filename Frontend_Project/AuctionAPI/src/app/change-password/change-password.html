<div class="container my-5" style="max-width: 500px; min-height:50vh">
  <div class="card shadow-lg border-0">
    <div class="card-body">
      <h4 class="card-title mb-4 text-center">Change Password</h4>

      <form [formGroup]="changeForm" (ngSubmit)="onSubmit()">
     
        <div class="mb-3">
          <label class="form-label">Old Password</label>
          <div class="input-group">
            <input [type]="showOld ? 'text' : 'password'"
                   class="form-control"
                   formControlName="oldPassword"
                   placeholder="Enter current password">
            <button class="btn btn-outline-secondary" type="button" (click)="toggle('old')">
              <i class="bi" [ngClass]="showOld ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">New Password</label>
          <div class="input-group">
            <input [type]="showNew ? 'text' : 'password'"
                   class="form-control"
                   formControlName="newPassword"
                   placeholder="Enter new password">
            <button class="btn btn-outline-secondary" type="button" (click)="toggle('new')">
              <i class="bi" [ngClass]="showNew ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
            
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <input [type]="showConfirm ? 'text' : 'password'"
                   class="form-control"
                   formControlName="confirmPassword"
                   placeholder="Re-enter new password">
            <button class="btn btn-outline-secondary" type="button" (click)="toggle('confirm')">
              <i class="bi" [ngClass]="showConfirm ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div *ngIf="changeForm.hasError('mismatch')" class="alert alert-danger py-1 small">
          Passwords do not match.
        </div>

        <div class="d-grid">
          <button type="submit" class="btn " [disabled]="changeForm.invalid">
            Change Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div *ngIf="successMessage" class="alert alert-success text-center fixed-top mx-auto w-75 mt-3">
  {{ successMessage }}
</div>
<div *ngIf="errorMessage" class="alert alert-danger text-center fixed-top mx-auto w-75 mt-3">
  {{ errorMessage }}
</div>
