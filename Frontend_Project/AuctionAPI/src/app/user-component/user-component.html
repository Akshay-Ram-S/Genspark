<div class="card user-card border-0 shadow-sm rounded-4 text-center">
  <div class="card-body px-4 py-5">
    <div class="avatar mb-3 mx-auto">
      {{ user.name[0] }}
    </div>
    <h4 class="card-title mb-1 text-capitalize text-gold">{{ user.name }}</h4>
    <p class="mb-1"><i class="bi bi-envelope me-2"></i>{{ user.email }}</p>
    <p class="mb-3 text-capitalize"><i class="bi bi-person-badge me-2"></i>{{ user.role }}</p>

    <button class="btn btn-golden px-4 py-2" (click)="onViewProfile()">
      <i class="bi bi-person-lines-fill me-2"></i> View Profile
    </button>
  </div>
</div>
