<div class="text-center py-5" *ngIf="isLoading">
  <div class="spinner-border text-warning" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="container-fluid my-4" style="min-height: 100vh;" *ngIf="!isLoading">

  <div class="row justify-content-center mb-4">
    <div class="col-12 col-md-10 col-lg-8">
      <div class="input-group input-group-lg shadow-sm">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Search items..." 
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange($event)" />
      </div>
    </div>
  </div>

  <div class="row justify-content-center mb-5">
    <div class="col-12 col-lg-11">
      <div class="card shadow-sm border-0" style="background-color: aliceblue;">

        <div class="card-body px-3 py-3">
          <div class="d-flex flex-wrap align-items-end gap-3">

            <div class="flex-grow-1" style="min-width: 100px;">
              <label class="form-label medium mb-1">Category</label>
              <select class="form-select form-select-sm" [(ngModel)]="selectedCategory" (change)="onFilterChange()">
                <option value="">All</option>
                <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
              </select>
            </div>

            <div class="flex-grow-1" style="min-width: 100px;">
              <label class="form-label medium mb-1">Starting Price</label>
              <input type="number" class="form-control form-control-sm" [(ngModel)]="startingPrice" (change)="onFilterChange()" />
            </div>

            <div class="flex-grow-1" style="min-width: 100px;">
              <label class="form-label medium mb-1">Ending Price</label>
              <input type="number" class="form-control form-control-sm" [(ngModel)]="endingPrice" (change)="onFilterChange()" />
            </div>

            <div class="flex-grow-1" style="min-width: 100px;">
              <label class="form-label medium mb-1">Ending Before</label>
              <input type="date" class="form-control form-control-sm" [(ngModel)]="endDateBefore" (change)="onFilterChange()" />
            </div>

            <div class="flex-grow-1" style="min-width: 100px;">
              <label class="form-label medium mb-1">Status</label>
              <select class="form-select form-select-sm" [(ngModel)]="selectedStatus" (change)="onFilterChange()">
                <option value="">All</option>
                <option *ngFor="let state of status" [value]="state">{{ state }}</option>
              </select>
            </div>

            <div>
              <button class="btn btn-outline-secondary btn-sm w-100 mt-1" (click)="clearFilters()" style="height:2.5em">
                <i class="bi bi-arrow-counterclockwise me-1"></i> 
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row justify-content-center g-4" *ngIf="!noItemsFound">
    @for (item of items; track item.itemID; let i = $index) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4 d-flex justify-content-center">
        <div class="animate__animated animate__fadeIn" [style.animationDelay]="(i * 200) + 'ms'">
          <app-item [item]="item"></app-item>
        </div>
      </div>
    }
  </div>

  
  <div class="text-center text-muted py-4" *ngIf="noItemsFound">
    <h5>No items found.</h5>
  </div>

</div>

<!-- Pagination -->
<div class="d-flex justify-content-center my-4" *ngIf="totalPages > 1">
  <nav>
    <ul class="pagination pagination m-0">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="goPrevious()">«</button>
      </li>

      <li 
        class="page-item"
        *ngFor="let page of pages"
        [class.active]="page === currentPage">
        <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
      </li>

      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="goNext()">»</button>
      </li>
    </ul>
  </nav>
</div>
