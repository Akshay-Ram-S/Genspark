<div class="text-center py-4" *ngIf="isLoading">
  <div class="spinner-border text-warning" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="container-fluid my-4" style="min-height: 100vh;">

  <br/>

  <div class="row justify-content-center mb-3">
    <div class="col-md-9">
      <div class="input-group input-group-lg">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Search items..." 
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange($event)" />
        <button 
          class="btn btn-outline-secondary px-4"
          style="width: 70px" 
          type="button" 
          (click)="onSearchChange(searchTerm)">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>
  </div>

<div class="row justify-content-center mb-4">
  <div class="col-md-9">
    <div class="card shadow-sm">
      <div class="card-header text-white py-2"> 
        <strong>Filters</strong>
      </div>

      <div class="card-body row py-2"> 
        <div class="col-md-4 mb-2"> 
          <label class="form-label small mb-1">Category</label>
          <select class="form-select form-select-sm" [(ngModel)]="selectedCategory" (change)="onFilterChange()">
            <option value="">All</option>
            <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
          </select>
        </div>

        <div class="col-md-4 mb-2">
          <label class="form-label small mb-1">Starting Price</label>
          <input type="number" class="form-control form-control-sm mb-1" [(ngModel)]="startingPrice" (change)="onFilterChange()" />
          <input type="range" class="form-range" min="0" max="100000" step="100" [(ngModel)]="startingPrice" (change)="onFilterChange()" />
        </div>

        <div class="col-md-4 mb-2">
          <label class="form-label small mb-1">Ending Price</label>
          <input type="number" class="form-control form-control-sm mb-1" [(ngModel)]="endingPrice" (change)="onFilterChange()" />
          <input type="range" class="form-range" min="0" max="100000" step="100" [(ngModel)]="endingPrice" (change)="onFilterChange()" />
        </div>

        <div class="col-md-4 mb-2">
          <label class="form-label small mb-1">Ending Before</label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="endDateBefore" (change)="onFilterChange()" />
        </div>

        <div class="col-md-4 mb-2">
          <label class="form-label small mb-1">Status</label>
          <select class="form-select form-select-sm" [(ngModel)]="selectedStatus" (change)="onFilterChange()">
            <option value="">All</option>
            <option *ngFor="let state of status" [value]="state">{{ state }}</option>
          </select>
        </div>

        <div class="col-md-4 d-flex align-items-end justify-content-center mt-1">
          <button class="btn btn-sm btn-outline-secondary" (click)="clearFilters()">
            <i class="bi bi-arrow-counterclockwise me-2"></i> Clear
          </button>
        </div>
      </div>
    </div>
  </div>
</div>


<br>

<div class="row justify-content-center mb-4" style="row-gap: 3rem;" *ngIf="!noItemsFound">
  @for (item of items; track item.itemID) {
    <div class="col-sm-10 col-md-6 d-flex justify-content-center">
      <app-item [item]="item" />
    </div>
  }
</div>


<div class="text-center text-muted py-4" *ngIf="noItemsFound">
  <h5>No items found.</h5>
</div>
