<div class="text-center py-4" *ngIf="isLoading">
  <div class="spinner-border text-warning" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="container-fluid my-4" style="background-color: aliceblue; min-height: 100vh;">

  <div class="row justify-content-center mb-2" *ngIf="isSeller">
    <div class="col-md-7 text-center">
      <button class="btn btn-color mb-1" (click)="onPostItem()" title="Post a new item">
        <strong class="bi bi-plus-lg me-1"></strong> Post Item
      </button>
    </div>
  </div>

  <div class="row justify-content-center mb-5">
    <div class="col-md-9">
      <div class="input-group input-group-lg">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Search items..." 
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange($event)" />
        <button 
          class="btn btn-outline-secondary px-4"
          style="width: 70px" 
          type="button" 
          (click)="onSearchChange(searchTerm)">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    
    <div class="col-10 col-lg-8">
      <div class="d-flex flex-column align-items-center">

        @if (!noItemsFound) {
          @for (item of items; track item.itemID) {
            <app-item [item]="item" />
          }
        } @else {
          <div class="text-center text-muted py-4">
            <h5>No items found.</h5>
          </div>
        }

        <div class="d-flex justify-content-center mt-4" *ngIf="totalPages > 1">
          <nav>
            
            <ul class="pagination gap-2 justify-content-center">
              <li class="page-item">
                <button 
                  class="page-link rounded-pill px-4 py-2"
                  (click)="goPrevious()"
                  [disabled]="currentPage === 1">
                  <i class="bi bi-chevron-left"></i>
                </button>
              </li>

              <li class="page-item" *ngFor="let page of pages">
                <button 
                  class="page-link rounded-pill px-4 py-2"
                  (click)="goToPage(page)"
                  [ngClass]="{
                    'active-page': currentPage === page
                  }"
                >
                  {{ page }}
                </button>
              </li>

              <li class="page-item">
                <button 
                  class="page-link rounded-pill px-4 py-2"
                  (click)="goNext()"
                  [disabled]="currentPage === totalPages">
                  <i class="bi bi-chevron-right"></i>
                </button>
              </li>
            </ul>


          </nav>
        </div>


      </div>
    </div>

    <div class="col-12 col-lg-4 pt-4 pt-lg-3" style="padding-right: 10rem;">
      <div class="card shadow-sm">
        <div class="card-header text-white">
          <strong>Filters</strong>
        </div>
        <div class="card-body">

          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" [(ngModel)]="selectedCategory" (change)="onFilterChange()">
              <option value="">All</option>
              <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Starting Price</label>
            <input 
              type="number" 
              class="form-control mb-2" 
              [(ngModel)]="startingPrice" 
              (change)="onFilterChange()" 
              placeholder="Enter minimum price" />
            <input 
              type="range" 
              class="form-range" 
              min="0" 
              max="100000" 
              step="100" 
              [(ngModel)]="startingPrice" 
              (change)="onFilterChange()" />
          </div>

          <div class="mb-3">
            <label class="form-label">Ending Price</label>
            <input 
              type="number" 
              class="form-control mb-2" 
              [(ngModel)]="endingPrice" 
              (change)="onFilterChange()" 
              placeholder="Enter maximum price" />
            <input 
              type="range" 
              class="form-range" 
              min="0" 
              max="100000" 
              step="100" 
              [(ngModel)]="endingPrice" 
              (change)="onFilterChange()" />
          </div>

          <div class="mb-3">
            <label class="form-label">Ending Before</label>
            <input 
              type="date" 
              class="form-control" 
              [(ngModel)]="endDateBefore" 
              (change)="onFilterChange()" />
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
