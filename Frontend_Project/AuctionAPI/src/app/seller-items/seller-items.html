<div *ngIf="errorMessage" class="alert alert-warning text-center">
  {{ errorMessage }}
</div>

<div class="container" style="align-items: center; margin-left: 25rem;">
  <div class="row justify-content-center mt-4 gap-4 mb-4">
    @for (item of items; track item.itemID) {
      <app-item [item]="item" [sellerName]="sellerName"></app-item>
    }
  </div>
</div>
