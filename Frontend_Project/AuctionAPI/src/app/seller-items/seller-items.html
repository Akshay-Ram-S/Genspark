<div *ngIf="errorMessage" class="alert alert-warning text-center">
  {{ errorMessage }}
</div>

<div class="container my-4 d-flex flex-column align-items-center">
  <div class="row justify-content-center mt-4 gap-4 mb-4" style="max-width:800px">
    @for (item of items; track item.itemID) {
      <app-item [item]="item" [sellerName]="sellerName" [isOwnProfile]="ownProfile"></app-item>
    }
  </div>
</div>
