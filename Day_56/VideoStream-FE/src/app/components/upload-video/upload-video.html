<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h5>Upload Video</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #uploadForm="ngForm">
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input
            type="text"
            id="title"
            name="title"
            class="form-control"
            [(ngModel)]="title"
            required
            [disabled]="isUploading"
          />
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea
            id="description"
            name="description"
            class="form-control"
            rows="3"
            [(ngModel)]="description"
            required
            [disabled]="isUploading"
          ></textarea>
        </div>
        <div class="mb-3">
          <label for="fileInput" class="form-label">Select a file</label>
          <input
            type="file"
            id="fileInput"
            name="file"
            class="form-control"
            (change)="onFileSelected($event)"
            [disabled]="isUploading"
            required
          />
        </div>

        <div *ngIf="previewUrl && isImage" class="mb-3">
          <img [src]="previewUrl" class="img-thumbnail" style="max-height: 200px;" />
        </div>

        <div *ngIf="previewUrl && isVideo" class="mb-3">
          <video [src]="previewUrl" class="w-100" controls style="max-height: 300px;"></video>
        </div>

        <button class="btn btn-primary" type="submit" [disabled]="!file || isUploading">
          {{ isUploading ? 'Uploading...' : 'Upload' }}
        </button>
      </form>
    </div>
  </div>
</div>
