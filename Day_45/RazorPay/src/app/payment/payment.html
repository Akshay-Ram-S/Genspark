<div 
  *ngIf="message"
  class="bg-success text-white d-flex align-items-center justify-content-center fw-medium mb-5"
  style="position: fixed; top: 0; left: 0; width: 100%; height: 80px; z-index: 10;"
>
  <span class="fs-5">
    {{ message }}
  </span>
</div>


<div class="container mt-5">
  <div class="card shadow-sm mx-auto" style="max-width: 500px; margin-top: 150px">
    <div class="card-body p-4">
      <h2 class="card-title text-center text-primary mb-4">
        Razorpay Test
      </h2>

      <form [formGroup]="paymentForm" (ngSubmit)="pay()">

        <div class="mb-3">
          <label class="form-label">Amount (₹)</label>
          <input
            type="number"
            formControlName="amount"
            class="form-control"
            placeholder="Enter amount"
          />
          <div class="text-danger small mt-1">{{ showError('amount') }}</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Customer Name</label>
          <input
            type="text"
            formControlName="name"
            class="form-control"
            placeholder="Your full name"
          />
          <div class="text-danger small mt-1">{{ showError('name') }}</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            formControlName="email"
            class="form-control"
            placeholder="your email"
          />
          <div class="text-danger small mt-1">{{ showError('email') }}</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Contact Number</label>
          <input
            type="tel"
            formControlName="contact"
            class="form-control"
            placeholder="10-digit mobile number"
          />
          <div class="text-danger small mt-1">{{ showError('contact') }}</div>
        </div>

        <div class="d-grid mt-4">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="isProcessing"
          >
            {{ isProcessing ? '...' : 'Pay Now' }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
